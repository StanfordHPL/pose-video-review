<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pose Video Review</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Pose Video Review</div>
      <label class="trial-field">
        <span>Trial</span>
        <button id="previousTrialButton" type="button">Previous</button>
        <select id="trialSelect"></select>
        <button id="nextTrialButton" type="button">Next</button>
        <span id="trialProgress" class="trial-progress"></span>
      </label>
      <label class="filter-field">
        <span>Trial type</span>
        <select id="trialTypeFilter">
          <option value="dynamic" selected>Dynamic</option>
          <option value="neutral">Neutral</option>
          <option value="all">All trials</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Status</span>
        <select id="saveFilter">
          <option value="all">All</option>
          <option value="unsaved">Unsaved</option>
          <option value="saved">Saved</option>
        </select>
      </label>
      <label class="tile-size-field">
        <span>Tile size</span>
        <input id="tileSize" type="range" min="260" max="900" step="10" value="430">
        <output id="tileSizeValue" for="tileSize">430 px</output>
      </label>
      <label class="toggle"><input id="showPose" type="checkbox" checked><span>Pose overlay</span></label>
      <div id="status" class="status">Loading trials…</div>
    </header>

    <main>
      <section id="cameraGrid" class="camera-grid"></section>
      <section class="transport" aria-label="Playback controls">
        <button id="playButton" type="button">Play</button>
        <button id="stepBackButton" type="button" aria-label="Previous frame">−1</button>
        <button id="stepForwardButton" type="button" aria-label="Next frame">+1</button>
        <button id="markRoiStartButton" type="button" data-roi-control hidden>Mark ROI start</button>
        <button id="markRoiEndButton" type="button" data-roi-control hidden>Mark ROI end</button>
        <button id="clearRoiButton" type="button" data-roi-control hidden>Clear ROI</button>
        <button id="saveOffsetsButton" type="button" disabled>Save offsets</button>
        <div class="scrubber">
          <input id="timeSlider" type="range" min="0" max="0" step="0.001" value="0">
          <div class="time-readout">
            <span id="currentTime">0.000 s</span>
            <span id="roiReadout" data-roi-control hidden>ROI —</span>
            <span id="duration">0.000 s</span>
          </div>
        </div>
        <label class="speed-field">
          <span>Speed</span>
          <select id="speedSelect">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label class="toggle"><input id="loopPlayback" type="checkbox"><span>Loop</span></label>
      </section>
    </main>
    <script src="/static/timing.js"></script>
    <script src="/static/filters.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
